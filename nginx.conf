server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry point, so users always get pointed at the latest build
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # TODO: confirm this matches build.sh's actual output folder name
    # (assuming Vite's default "assets/" - CRA would be "static/" instead)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unmatched paths go to index.html so client-side routing
    # (React Router etc.) handles them instead of nginx 404ing on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
